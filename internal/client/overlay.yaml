# Applied to api/openapi.yaml by oapi-codegen before generation (see
# oapi-codegen.yaml). oapi-codegen 2.9.0 stopped adding `omitempty` to optional
# nullable fields, which would make the provider send `"field": null` for every
# pointer it leaves unset. To the API an explicit null often means "clear this
# value", so the first action puts `omitempty` back.
#
# It is ONE action on purpose. Overlays are applied strictly: an action whose
# target matches nothing fails `go generate`, so a separate action per spelling
# of "nullable" would break generation as soon as the vendored spec stopped
# using (or, for `anyOf`, before it started using) that spelling.
#
# The target only sees a null written on the property itself: a `'null'` in its
# `type` list, or a `type: 'null'` branch of its `oneOf`/`anyOf`. oapi-codegen
# also treats a property as nullable when it is a `$ref` to a nullable schema or
# has a nullable `allOf` member, and JSONPath cannot follow those. Such a field
# would lose `omitempty`; TestContract_OnlyRequiredNullableFieldsLackOmitempty
# fails when that happens, and the fix is an `x-omitempty: true` action naming
# that property.
#
# The remaining actions undo the first for properties that are REQUIRED and
# nullable: there a null must reach the wire (a null `quota_gb` reverts an org
# to the platform default). TestContract_RequiredNullableFieldsAreKnown fails
# when the vendored spec gains or loses such a property, and
# TestContract_OnlyRequiredNullableFieldsLackOmitempty fails when one of them
# is not listed here.
overlay: 1.0.0
info:
  title: Keep optional nullable fields out of requests when unset
  version: 1.0.0
actions:
  - target: "$..properties[?@.type[?@ == 'null'] || @.oneOf[?@.type == 'null'] || @.anyOf[?@.type == 'null']]"
    update:
      x-omitempty: true
  - target: "$.components.schemas.SharedStorageQuota.properties['configured_gb','observed_quota_bytes','observed_used_bytes']"
    update:
      x-omitempty: false
  - target: "$.paths['/api/v1/admin/organizations/{orgID}/storage-quota'].put.requestBody.content['application/json'].schema.properties.quota_gb"
    update:
      x-omitempty: false
